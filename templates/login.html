<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='customized.css') }}">
    <style>
        .main {
            background-color: #323232;
        }
        .center-content {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #geo_db {
            width: 250px;
            height: auto;
            display: block;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 20px;
        }
        .login-box {
            background-color: ghostwhite;
            padding: 30px;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
    </style>
</head>
<body class="main">
    <div class="container center-content">
        <div class="row justify-content-center">
            <div class="col-md-12 ">
                <div class="card login-box">
                    <img id="geo_db" src="{{ url_for('static', filename='geodatabank-logo.png') }}" alt="GeoDatabank Logo">
                    {% with messages = get_flashed_messages(with_categories=True) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    
                    <form method="POST" action="/login">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="user" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" id="password" name="password" placeholder="password" required>
                        </div>
                        <button type="submit" class="selective-button mb-2">Einloggen</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
