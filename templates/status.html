{% extends "base.html" %}

{% block main_content %}
<div class="container">
    <h2>Import Status</h2>
    <ul class="list-group">
        {% for key, value in status.items() %}
            {% if key == 'progress' %}
                <li class="list-group-item" id="progress-{{ key }}">{{ key }} - {{ value }}%</li>
            {% else %}
                <li class="list-group-item" id="status-{{ key }}">{{ key }} - {{ value }}</li>
            {% endif %}
        {% endfor %}
    </ul>
</div>
{% endblock %}
